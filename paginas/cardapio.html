<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café com Código</title>
    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/cardapio.css">

<body>
    <header>
        <img class="logo" src="imagens/logo.png" alt="logo do site">
        <h1>Café com Código</h1>

    </header>
    <main class="cardapio">
        <nav>
